services:
  skautapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Umbraco__CMS__Runtime__Mode=BackofficeDevelopment
      - Umbraco__CMS__ModelsBuilder__ModelsMode=Nothing
    volumes:
      - ./umbraco/Data:/app/umbraco/Data
    restart: always