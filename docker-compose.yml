services:
  skautapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Umbraco__CMS__Global__UseHttps=false
      - Umbraco__CMS__RuntimeMinification__CacheBuster=Version
      - Umbraco__CMS__ModelsBuilder__ModelsMode=Nothing
      - ConnectionStrings__umbracoDbDSN=Data Source=/app/umbraco/Data/Modry_zivot.sqlite.db;Cache=Shared;
    volumes:
      - ./umbraco/Data:/app/umbraco/Data
    restart: always