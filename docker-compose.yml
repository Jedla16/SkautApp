services:
  skautapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Umbraco__CMS__Runtime__Mode=Development
      - ConnectionStrings__umbracoDbDSN=Data Source=/app/umbraco/Data/Modry_zivot.sqlite.db;Cache=Shared;
    volumes:
      - ./umbraco/Data:/app/umbraco/Data
    restart: always