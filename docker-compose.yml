services:
  skautapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__umbracoDbDSN=Data Source=/app/umbraco/Data/Modry_zivot.sqlite.db;Cache=Shared;
      - ConnectionStrings__umbracoDbDSN_ProviderName=Microsoft.Data.Sqlite
      - Umbraco__CMS__Global__UseHttps=false
      - Umbraco__CMS__Unattended__UpgradeUnattended=true
    volumes:
      - ./umbraco/Data:/app/umbraco/Data
    restart: always